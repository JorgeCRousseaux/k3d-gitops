apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: nginx-gitops

  annotations:
    cert-manager.io/cluster-issuer: lab-ca-issuer

spec:
  ingressClassName: nginx

  tls:
  - hosts:
    - nginx-gitops.local

    secretName: nginx-gitops-tls

  rules:
  - host: nginx-gitops.local

    http:
      paths:
      - path: /
        pathType: Prefix

        backend:
          service:
            name: nginx-gitops
            port:
              number: 80